<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Аренда Неба</title>
    <link rel="stylesheet" href="admin-styles.css?v=20261015b">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <div class="login-header">
                <div class="logo">
                    <span class="logo-icon">☁️</span>
                    <span class="logo-text">Аренда Неба</span>
                </div>
                <h2>Панель администратора</h2>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Войти</button>
                <div id="loginError" class="error-message"></div>
            </form>
            <div class="login-footer">
                <a href="index.html">← Вернуться на главную</a>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="admin-dashboard" style="display: none;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">☁️</span>
                    <span class="logo-text">Аренда Неба</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#requests" class="nav-item active" data-section="requests">
                    <span class="nav-icon">📩</span>
                    <span class="nav-label">Заявки</span>
                    <span class="nav-badge" id="newRequestsBadge"></span>
                </a>
                <a href="#services" class="nav-item" data-section="services">
                    <span class="nav-icon">🚚</span>
                    <span class="nav-label">Автопарк</span>
                </a>
                <a href="#reviews" class="nav-item" data-section="reviews">
                    <span class="nav-icon">⭐</span>
                    <span class="nav-label">Отзывы</span>
                </a>
                <a href="#homepage" class="nav-item" data-section="homepage">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-label">Главная сайта</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/" target="_blank" rel="noopener" class="sidebar-link">↗ Открыть сайт</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <h1 id="sectionTitle">Заявки</h1>
                <div class="user-info">
                    <span id="currentUser" class="user-name"></span>
                    <button id="logoutBtn" class="btn btn-small btn-secondary">Выйти</button>
                </div>
            </div>

            <div class="content-body">
                <!-- Requests Section -->
                <div id="requestsSection" class="admin-section">
                    <div class="list-toolbar">
                        <div class="chips" id="requestsFilter"></div>
                        <span class="spacer"></span>
                        <input type="search" id="requestsSearch" class="search-input" placeholder="Имя, телефон, техника…" autocomplete="off">
                    </div>
                    <div id="requestsList" class="items-list">
                        <div class="skeleton"></div><div class="skeleton"></div>
                    </div>
                </div>

                <!-- Services Section -->
                <div id="servicesSection" class="admin-section" style="display: none;">
                    <div class="section-actions">
                        <button class="btn btn-primary" onclick="showServiceModal()">+ Добавить технику</button>
                        <span class="spacer"></span>
                        <div id="servicesArchiveToggle"></div>
                    </div>
                    <div id="servicesList">
                        <!-- Services will be loaded here -->
                    </div>
                </div>

                <!-- Reviews Section -->
                <div id="reviewsSection" class="admin-section" style="display: none;">
                    <div class="section-actions">
                        <button class="btn btn-primary" onclick="showReviewModal()">+ Добавить отзыв</button>
                    </div>
                    <div id="reviewsList" class="items-grid">
                        <!-- Reviews will be loaded here -->
                    </div>
                </div>

                <!-- Homepage Section -->
                <div id="homepageSection" class="admin-section" style="display: none;">
                    <div id="homepageForm" class="content-form">
                        <!-- Form will be populated dynamically -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for adding/editing items -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Form will be populated dynamically -->
            </div>
        </div>
    </div>

    <script src="admin-script.js?v=20261015"></script>
</body>
</html>
